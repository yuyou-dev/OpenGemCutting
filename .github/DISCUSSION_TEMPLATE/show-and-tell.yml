title: "[Showcase] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎展示你使用 OpenGemCutting 完成的可公开琢型、工艺实验或教学案例。
  - type: input
    id: design-name
    attributes:
      label: 琢型或作品名称
      placeholder: 例如：96 分度八边形彩宝实验
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: 设计思路与结果
      description: 说明材料、分度、关键参数、光学观察或实际切磨结果。
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 图片与可共享文件
      description: 可附上截图、照片或你有权公开的 JSON/ASC 文件。
    validations:
      required: true
  - type: checkboxes
    id: sharing-rights
    attributes:
      label: 共享确认
      options:
        - label: 我有权公开这些文字、图片和设计文件，且内容不含凭据或客户隐私。
          required: true
